[tool.poetry]
name = "bewegungskalender"
version = "2024.11"
description = "A tool to automatically share caldav events to telegram, e-mail and a nicegui website that includes a map."
authors = ["Whoami <aberallesigut@riseup.net>"] 
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10.2"
nicegui = "^2.5.0"
caldav = "^1.3.9"
geojson = "^3.1.0"
icalendar = "^6.0.1"
Jinja2 = "^3.1.4"
python-slugify = "^8.0.4"
pytz = "^2024.2"
PyYAML = "^6.0.2"
requests = "^2.32.3"
urllib3 = "^2.2.3"
python-telegram-bot = "^21.6"
validators = "^0.34.0"
sqlmodel = "^0.0.22"
geopy = "^2.4.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
