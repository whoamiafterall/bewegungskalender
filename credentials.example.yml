# Nextcloud-Section - Mandatory!
nextcloud: # Configuration for your Nextcloud Account (domain, user, token)
  domain: 'cloud.example.org'
  username: 'username'
  token: 'XXXXX-XXXXX-XXXXX-XXXXX-XXXXX' # In most cases you need to get an App Token, e.g. https://wiki.systemli.org/howto/nextcloud/app-password
  # If your nextcloud instance doesn't use app tokens just provide your account password above

# Mail Section - Only necessary if you want to send automated Mails
mail: # Configuration for your Mail Account (user, password, domain, port)
  account: "username@example.org"
  password: 'my_mail_password'
  domain: 'mail.example.org' # The (sub-)domain where your Mail Server is running
  smtp_port: 465 # Usually its 465 or 587 depending on SSL vs STARTTLS

# Telegram Section - Only necessary if you want to send (and edit) automated Telegram messages
telegram: # Configuration for your Telegram Bot (token, test_channel_id, production_channel_id)
  token: 'XXXXXXXXXXX:XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX'
  test_channel_id: '-XXXXXXXXXXXXX' # The Channel you will use for debugging and testing
  production_channel_id: '-XXXXXXXXXXXXX' # The Channel you actually want to send messages to

# Mastodon Section - Only necessary if you want to send automated posts to Mastodon
mastodon: # Create an Application on your Mastodon Account and enter the secrets here - see https://learn.adafruit.com/intro-to-mastodon-api-circuitpython/generate-your-mastodon-token
  client_key: 'XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX'
  client_secret: 'XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX'
  access_token: 'XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX'
  instance: 'example.social' # The part of your account behind the @ - e.g. chaos.social or climatejustice.social (it doesn't have to be .social)